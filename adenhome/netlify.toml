[build]
  command = "npm run build"
  publish = ".next" # or "netlify", depending on Netlify's Next preset / docs you followed
  [build.environment]
    SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,FIREBASE_PROJECT_ID,FIREBASE_CLIENT_EMAIL,FIREBASE_PRIVATE_KEY,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,GOOGLE_REDIRECT_URI,GOOGLE_REFRESH_TOKEN,SITE_PASSWORD,STRAPI_API_URL,STRAPI_API_TOKEN"
    SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/**,.next/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
